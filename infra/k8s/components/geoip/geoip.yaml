# The databases' one home in the cluster: `update` keeps them current on a
# small volume (update.sh), `serve` hands them to tracker pods. Ready once
# both databases are there. Needs egress to download.db-ip.com.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: geoip
  labels:
    app.kubernetes.io/name: geoip
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: geoip
  template:
    metadata:
      labels:
        app.kubernetes.io/name: geoip
      annotations:
        prometheus.io/scrape: "false"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: update
          image: alpine:3.21
          command: ["sh", "/scripts/update.sh"]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: scripts, mountPath: /scripts, readOnly: true}
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
        - name: serve
          image: caddy:2.10-alpine
          command: ["caddy", "file-server", "--root", "/data", "--listen", ":8080"]
          env:
            # Caddy's own state, off the read-only root.
            - {name: XDG_DATA_HOME, value: /caddy}
            - {name: XDG_CONFIG_HOME, value: /caddy}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 30
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            # The caddy binary carries cap_net_bind_service as a file
            # capability; without it in the set, exec is refused.
            capabilities: {drop: [ALL], add: [NET_BIND_SERVICE]}
          volumeMounts:
            - {name: data, mountPath: /data, readOnly: true}
            - {name: caddy, mountPath: /caddy}
      volumes:
        - name: scripts
          configMap:
            name: geoip-update
        - name: data
          persistentVolumeClaim:
            claimName: geoip
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
        - name: caddy
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: geoip
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: geoip
  labels:
    app.kubernetes.io/name: geoip
spec:
  selector:
    app.kubernetes.io/name: geoip
  ports:
    - {name: http, port: 8080, targetPort: http}
