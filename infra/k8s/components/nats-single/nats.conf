# A single NATS server with JetStream (components/nats-single).
server_name: $POD_NAME
listen: 0.0.0.0:4222
http: 0.0.0.0:8222
pid_file: /var/run/nats/nats.pid
max_payload: 1MB
lame_duck_duration: 30s
lame_duck_grace_period: 10s

jetstream {
  store_dir: /data
  max_file_store: 4G
  max_memory_store: 128M
}
