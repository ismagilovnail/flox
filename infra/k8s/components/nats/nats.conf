# One server of the FLOX JetStream cluster. POD_NAME comes from the pod.
server_name: $POD_NAME
listen: 0.0.0.0:4222
http: 0.0.0.0:8222
pid_file: /var/run/nats/nats.pid
# A tracker message is at most 512 KB (internal/eventstream).
max_payload: 1MB
# On shutdown, hand clients and stream leadership to the other servers
# before exiting.
lame_duck_duration: 30s
lame_duck_grace_period: 10s

# Clients log in (tracker, worker: NATS_URL=nats://flox:<password>@nats:4222).
# NATS_PASSWORD comes from the Secret flox-secrets, through the pod's env.
authorization {
  user: flox
  password: $NATS_PASSWORD
}

jetstream {
  store_dir: /data
  max_file_store: 18G
  max_memory_store: 256M
}

# Routes log in too. NATS does not expand variables inside a URL, so the
# container writes this file with @ROUTE_PASSWORD@ replaced by
# NATS_ROUTE_PASSWORD (nats.yaml) before it starts the server.
cluster {
  name: flox
  listen: 0.0.0.0:6222
  authorization {
    user: route
    password: $NATS_ROUTE_PASSWORD
  }
  routes: [
    nats://route:@ROUTE_PASSWORD@@nats-0.nats-headless:6222
    nats://route:@ROUTE_PASSWORD@@nats-1.nats-headless:6222
    nats://route:@ROUTE_PASSWORD@@nats-2.nats-headless:6222
  ]
}
