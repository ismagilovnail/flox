apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: flox
  labels:
    app.kubernetes.io/name: flox
spec:
  selector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [api, tracker, worker, backup]
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 15s
      # infra/alerts.yml matches job="flox-api", "flox-tracker",
      # "flox-worker", "flox-backup" (the compose scrape jobs); without
      # this every target here would be job="flox/flox" and the down
      # alerts would never fire.
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
          targetLabel: job
          replacement: flox-$1
