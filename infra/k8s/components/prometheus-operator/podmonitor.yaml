apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: flox
  labels:
    app.kubernetes.io/name: flox
spec:
  selector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [api, tracker, worker]
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 15s
