# The tracker's public edge: Caddy terminating HTTPS for every tracking
# domain organizations add, with on-demand certificates (Caddy asks the
# tracker's /internal/tls-ask before issuing — infra/Caddyfile.tracker,
# docs/deployment.md "HTTPS for tracking domains").
#
# Ports 80 and 443 must reach it from the internet (ACME), and customers'
# DNS points at its load balancer address (TRACKER_DNS_TARGET).
# externalTrafficPolicy: Local keeps the visitor's IP for X-Forwarded-For.
#
# Two replicas sharing one certificate volume (ReadWriteMany): Caddy
# instances on the same storage act as one cluster — a certificate is
# issued once (they lock through the storage), every replica loads it from
# there, and an ACME challenge started by one is answered by whichever
# replica the CA reaches. The volume needs a StorageClass that offers
# ReadWriteMany (EFS, Filestore, Azure Files, NFS, CephFS, Longhorn RWX);
# overlays/production names it. Not Redis: FLOX's Redis evicts keys when
# full (allkeys-lru), and a certificate must never be evicted.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge
  labels:
    app.kubernetes.io/name: edge
spec:
  replicas: 2
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: edge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edge
      annotations:
        prometheus.io/scrape: "false"
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: edge
      containers:
        - name: caddy
          image: caddy:2.10-alpine
          ports:
            - name: http
              containerPort: 80
            - name: https
              containerPort: 443
          env:
            - name: TRACKER
              value: tracker:8081
            - name: ACME_EMAIL
              valueFrom: {configMapKeyRef: {name: flox-config, key: ACME_EMAIL, optional: true}}
          readinessProbe:
            tcpSocket: {port: http}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          # The load balancer stops sending before Caddy stops.
          lifecycle:
            preStop:
              sleep: {seconds: 5}
          resources:
            requests: {cpu: 250m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [NET_BIND_SERVICE]
          volumeMounts:
            - name: caddyfile
              mountPath: /etc/caddy
              readOnly: true
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
      volumes:
        - name: caddyfile
          configMap:
            name: flox-edge-caddyfile
        - name: data
          persistentVolumeClaim:
            claimName: edge-certificates-shared
        - name: config
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: edge-certificates-shared
spec:
  # Shared by every replica (above).
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: edge
  labels:
    app.kubernetes.io/name: edge
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: edge
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: https
      port: 443
      targetPort: https
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: edge
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: edge
