# The tracker's public edge: Caddy terminating HTTPS for every tracking
# domain organizations add, with on-demand certificates (Caddy asks the
# tracker's /internal/tls-ask before issuing — infra/Caddyfile.tracker,
# docs/deployment.md "HTTPS for tracking domains").
#
# Ports 80 and 443 must reach it from the internet (ACME), and customers'
# DNS points at its load balancer address (TRACKER_DNS_TARGET).
# externalTrafficPolicy: Local keeps the visitor's IP for X-Forwarded-For.
#
# One replica: certificates live on a ReadWriteOnce volume. To run several,
# give Caddy shared storage (an RWX volume or a storage module such as
# Redis) first, or each replica requests its own certificates and hits the
# CA's rate limits.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge
  labels:
    app.kubernetes.io/name: edge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: edge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edge
      annotations:
        prometheus.io/scrape: "false"
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: caddy
          image: caddy:2.10-alpine
          ports:
            - name: http
              containerPort: 80
            - name: https
              containerPort: 443
          env:
            - name: TRACKER
              value: tracker:8081
            - name: ACME_EMAIL
              valueFrom: {configMapKeyRef: {name: flox-config, key: ACME_EMAIL, optional: true}}
          readinessProbe:
            tcpSocket: {port: http}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 250m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [NET_BIND_SERVICE]
          volumeMounts:
            - name: caddyfile
              mountPath: /etc/caddy
              readOnly: true
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
      volumes:
        - name: caddyfile
          configMap:
            name: flox-edge-caddyfile
        - name: data
          persistentVolumeClaim:
            claimName: edge-certificates
        - name: config
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: edge-certificates
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: edge
  labels:
    app.kubernetes.io/name: edge
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: edge
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: https
      port: 443
      targetPort: https
