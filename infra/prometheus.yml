# §53/Phase 29 dev-stack scrape config. apps/api, apps/tracker, and
# apps/worker now run as containers on infra/docker-compose.dev.yml's own
# network (the `api`/`tracker`/`worker` services, `dev` Dockerfile target)
# instead of on the host, so Prometheus reaches them by compose service
# name — no host.docker.internal/extra_hosts host-network trick needed.
# Ports match API_URL/TRACKER_URL/WORKER_URL's defaults in .env.example.
global:
  scrape_interval: 15s

# §61/Phase 33: alerting rules, evaluated against these same scrape
# targets. No Alertmanager is configured here (dev has no receiver to
# route to) — see infra/alerts.yml's own comment and docs/deployment.md.
# Rules still evaluate and show under Prometheus's own Alerts tab
# (http://localhost:9090/alerts) without one.
rule_files:
  - alerts.yml

scrape_configs:
  - job_name: flox-api
    static_configs:
      - targets: ["api:8080"]

  - job_name: flox-tracker
    static_configs:
      - targets: ["tracker:8081"]

  - job_name: flox-worker
    static_configs:
      - targets: ["worker:8082"]
