# Local dev infrastructure AND the four app binaries (§33, Phase 16;
# containerized dev loop added later — see infra/README.md). Every FLOX
# service runs as a container on this file's one default bridge network,
# addressed by service name (postgres, clickhouse, redis, minio, mailhog,
# api, tracker, worker, web) — nothing here uses host networking, and
# nothing needs to: `docker compose -f infra/docker-compose.dev.yml up -d`
# is the whole dev stack.
#
# api/tracker/worker build the `dev` target of their own Dockerfile (air
# hot-reload over a bind-mounted apps/ tree — code edits restart the
# binary in ~1s, no image rebuild); web targets the `deps` stage and runs
# `npm run dev` the same way. Go module/build caches and web's
# node_modules/.next live in named volumes so a container recreate
# doesn't redownload/rebuild everything from scratch.
#
# Values match .env.example's defaults for anything driven from the host
# (goose CLI, `go test`, etc.) — the app containers below override
# DATABASE_URL/CLICKHOUSE_URL/REDIS_URL/S3_ENDPOINT to the in-network
# service names instead of localhost, same pattern as
# docker-compose.test.yml.
services:
  postgres:
    # postgres:16-alpine plus WAL-G: every WAL segment is archived to the
    # backup bucket (docs/backup.md). archive_timeout bounds how much a
    # busy database can lose to 60 s; an idle one switches no segments.
    build:
      context: ../apps
      dockerfile: cmd/backup/Dockerfile
      target: postgres
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=wal-g wal-push %p
      - -c
      - archive_timeout=60
    environment:
      POSTGRES_USER: flox
      POSTGRES_PASSWORD: flox
      POSTGRES_DB: flox
      WALG_S3_PREFIX: s3://flox-backups/postgres
      AWS_ENDPOINT: http://minio:9000
      AWS_REGION: us-east-1
      AWS_S3_FORCE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: flox-minio-admin
      AWS_SECRET_ACCESS_KEY: flox-minio-secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flox -d flox"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    environment:
      CLICKHOUSE_DB: flox
      CLICKHOUSE_USER: flox
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      # Only the HTTP interface is exposed to the host — matches
      # CLICKHOUSE_URL in .env.example. The native protocol port (9000)
      # stays container-internal to avoid colliding with MinIO's API port
      # below.
      - "8123:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # Bounded, and evicting the least recently used key when full — the
    # default noeviction fails every write once full, and the rate limiter
    # then lets everything through (docs/deployment.md, audit R2).
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.10-alpine
    # JetStream on, stored on the volume; :8222 serves /healthz and the
    # monitoring endpoints. The tracker's event stream (internal/eventstream).
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz?js-enabled-only=true"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: flox-minio-admin
      MINIO_ROOT_PASSWORD: flox-minio-secret
    ports:
      - "9000:9000" # S3 API — matches S3_ENDPOINT in .env.example
      - "9001:9001" # web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s

      retries: 10

  mailhog:
    # Not part of any §N in the spec — this project   has no SMTP/email-
    # provider integration anywhere yet (see apps/internal/auth/model.go's
    # own comment: team invites deliberately generate a copyable link
    # instead of a real email, an explicit Phase 28 scope decision).
    # Added ahead of that so a real SMTP client has somewhere to send to
    # in dev the moment it's built — catches outgoing mail instead of
    # actually delivering it, web UI at :8025 to inspect what was "sent".
    # No healthcheck: the image ships no shell/wget/nc to run one with,
    # and nothing else here depends_on it.
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025" # SMTP — matches SMTP_URL in .env.example
      - "8025:8025" # web UI

  # One-shot goose runner (docs/migrations.md) — applies every Postgres
  # migration before api/tracker/worker start, so none of them race each
  # other applying schema changes. Same `migrate` Dockerfile target
  # docker-compose.test.yml uses. ClickHouse needs no equivalent step:
  # chstore.Migrate's idempotent CREATE ... IF NOT EXISTS runs inside
  # apps/api and apps/worker at their own startup (docs/migrations.md).
  migrate:
    build:
      context: ../apps
      dockerfile: api/Dockerfile
      target: migrate
    depends_on:
      postgres:
        condition: service_healthy
    command: ["postgres://flox:flox@postgres:5432/flox?sslmode=disable", "up"]

  api:
    build:
      context: ../apps
      dockerfile: api/Dockerfile
      target: dev
    depends_on:
      migrate:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      PUSH_VAPID_PUBLIC_KEY: "BNb_S-ZK4Yyjj83ASuHGNg2zOEJSAaJKnZTxO9Odl3uIh5xspXvbn_0GGLNbNeYpktH902Cwp6VSy1tDRYoFYrU"
      DATABASE_URL: postgres://flox:flox@postgres:5432/flox?sslmode=disable
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: flox
      CLICKHOUSE_USER: flox
      CLICKHOUSE_PASSWORD: ""
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      # A browser can't resolve the in-network "minio" hostname above —
      # apps/internal/storage signs presigned Content Gallery download URLs
      # against this instead (config.S3Config.PublicEndpoint's own doc
      # comment has the full reasoning).
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: flox
      S3_ACCESS_KEY_ID: flox-minio-admin
      S3_SECRET_ACCESS_KEY: flox-minio-secret
      # apps/internal/auth's signup flow sends a real email-verification
      # link over this — mailhog catches it (web UI at :8025) instead of
      # actually delivering it, same as every other dev credential here.
      SMTP_URL: smtp://mailhog:1025
      MAIL_FROM: "FLOX <no-reply@floxlink.io>"
      # Dev-only value, matches .env.example's own dev default exactly —
      # never reuse this in staging/production (see .env.example's comment).
      TOTP_ENCRYPTION_KEY: "IXkldrBTvgfDhIxzUBn3MrRAJq7Gh7z8mQ5UhBC4DRo="
      # Dev-only value, matches .env.example's own dev default exactly —
      # never reuse this in staging/production (see .env.example's comment).
      INTEGRATION_ENCRYPTION_KEY: "wLE0wIEHBNnfVfq8d62JDEAltM4frTgYmPi8XAv1QpY="
      # Dev-only value, matches .env.example's own dev default exactly —
      # never reuse this in staging/production (see .env.example's comment).
      # Also set on the worker service below — apps/worker's own ad-spend
      # sync needs the same key to decrypt Google Ads credentials.
      ADACCOUNT_ENCRYPTION_KEY: "KatbgYl+Kd4KPI5T0hKfwZRYsij/t7g7fVomXdjhW/c="
      # Pixels' access tokens (apps/internal/pixel) — dev-only, as above.
      PIXEL_ENCRYPTION_KEY: "F3TfKSy0V/JjydrKPdIFyN7Xu9s8ScgiQ0kXEBHGd08="
      # PWA constructor "open test page" links (internal/pwa/testlink.go):
      # same click-link key apps/tracker verifies with, and the tracker's
      # browser-reachable URL.
      LANDING_LINK_KEY: "19RzlC3SBPwVig37KNN84MG90P84kvYsr8dVA+jnXn8="
      TRACKER_PUBLIC_URL: http://localhost:8081
      # Dev placeholder — no domain in this stack has real DNS delegated
      # to a real Cloudflare account, so this never actually resolves
      # anywhere; it only exercises the real request shape (see
      # docs/domains-tracking-links.md's own registrar/DNS automation
      # section for what a real deployment should set here instead).
      TRACKER_DNS_TARGET: "tracker.floxlink.io"
      # The browser's own Origin (localhost:3000, web's host-published
      # port) — apps/internal/tenant.RequireSameOrigin (§54 CSRF) compares
      # against this literally, so it must never be the in-network "web"
      # hostname. Same reasoning as docker-compose.test.yml's api service.
      APP_URL: http://localhost:3000
    volumes:
      - ../apps:/src
      - api_go_mod_cache:/go/pkg/mod
      - api_go_build_cache:/root/.cache/go-build
    ports:
      - "8080:8080"
    healthcheck:
      # web's depends_on below needs this — the `dev` Dockerfile stage
      # has no HEALTHCHECK of its own (only the production runtime stage
      # does), so it's declared here instead.
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  tracker:
    build:
      context: ../apps
      dockerfile: tracker/Dockerfile
      target: dev
    depends_on:
      migrate:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      PUSH_VAPID_PUBLIC_KEY: "BNb_S-ZK4Yyjj83ASuHGNg2zOEJSAaJKnZTxO9Odl3uIh5xspXvbn_0GGLNbNeYpktH902Cwp6VSy1tDRYoFYrU"
      DATABASE_URL: postgres://flox:flox@postgres:5432/flox?sslmode=disable
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: flox
      CLICKHOUSE_USER: flox
      CLICKHOUSE_PASSWORD: ""
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
      # No .mmdb ships in the repo (docs/geoip.md). These paths point at
      # infra/geoip/ (bind-mounted below, gitignored); until the files
      # actually exist there, opening them fails at tracker startup and
      # it falls back to its Noop geo/ASN providers (a warning log, not a
      # crash — same behavior as before this existed). Default filenames
      # are DB-IP Lite's (CC BY 4.0, no registration required) —
      # apps/internal/classifier/maxmind reads either DB-IP or MaxMind
      # GeoLite2 databases unmodified; rename these two if using MaxMind
      # instead. Restart the tracker service after adding the files.
      GEOIP_CITY_DB_PATH: /geoip/dbip-city-lite.mmdb
      GEOIP_ASN_DB_PATH: /geoip/dbip-asn-lite.mmdb
      # Internal landings (docs/landings.md, "Serving visitors"): the
      # click-link signing key (dev-only value, matches .env.example), and
      # the object-storage endpoint/bucket so served pages' <base href>
      # points at their assets. No storage credentials: the tracker only
      # builds public URLs, it never reads or writes objects.
      LANDING_LINK_KEY: "19RzlC3SBPwVig37KNN84MG90P84kvYsr8dVA+jnXn8="
      # Signs sticky cookies (apps/tracker/sticky.go). Dev-only value;
      # a real deployment sets its own and keeps it: changing it re-buckets
      # every returning visitor.
      STICKY_COOKIE_KEY: "qTA7h7I11yKvJn3xWZQQHKGN2Jvc6WFgS7qVIWW/qy8="
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_BUCKET: flox
    volumes:
      - ../apps:/src
      - tracker_go_mod_cache:/go/pkg/mod
      - tracker_go_build_cache:/root/.cache/go-build
      - ./geoip:/geoip:ro
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8081/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  worker:
    build:
      context: ../apps
      dockerfile: worker/Dockerfile
      target: dev
    depends_on:
      migrate:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      PUSH_VAPID_PUBLIC_KEY: "BNb_S-ZK4Yyjj83ASuHGNg2zOEJSAaJKnZTxO9Odl3uIh5xspXvbn_0GGLNbNeYpktH902Cwp6VSy1tDRYoFYrU"
      PUSH_VAPID_PRIVATE_KEY: "6nSzoSNsEJGtd3kQGYD-2T8PoWZcjhTStFS3415XtFc"
      PUSH_VAPID_SUBJECT: "mailto:dev@flox.local"
      DATABASE_URL: postgres://flox:flox@postgres:5432/flox?sslmode=disable
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: flox
      CLICKHOUSE_USER: flox
      CLICKHOUSE_PASSWORD: ""
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: flox
      S3_ACCESS_KEY_ID: flox-minio-admin
      S3_SECRET_ACCESS_KEY: flox-minio-secret
      # Same dev-only value as the api service's own — the ad-spend sync
      # (§74/§27-COST) needs it to decrypt Google Ads credentials
      # apps/api encrypted at Connect time.
      ADACCOUNT_ENCRYPTION_KEY: "KatbgYl+Kd4KPI5T0hKfwZRYsij/t7g7fVomXdjhW/c="
      # Pixels' access tokens (apps/internal/pixel) — dev-only, as above.
      PIXEL_ENCRYPTION_KEY: "F3TfKSy0V/JjydrKPdIFyN7Xu9s8ScgiQ0kXEBHGd08="
      # Same dev-only value as the api's: alerts read the Slack webhook
      # apps/api encrypted (internal/alert).
      INTEGRATION_ENCRYPTION_KEY: "wLE0wIEHBNnfVfq8d62JDEAltM4frTgYmPi8XAv1QpY="
    volumes:
      - ../apps:/src
      - worker_go_mod_cache:/go/pkg/mod
      - worker_go_build_cache:/root/.cache/go-build
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8082/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      target: deps
    working_dir: /app
    command: ["npm", "run", "dev"]
    environment:
      # NEXT_PUBLIC_* is inlined into the client bundle only at `next
      # build` time — `next dev` reads it live from process env on every
      # request instead, so (unlike the production `web` stage) this
      # needs no --build-arg. Must be the URL a visitor's *browser*
      # reaches (api's host-published port), never the in-network "api"
      # hostname — see apps/web/Dockerfile's own note.
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ../apps/web:/app
      - web_node_modules:/app/node_modules
      - web_next_cache:/app/.next
    ports:
      - "3000:3000"

  backup:
    # Nightly backups of Postgres (WAL-G base backup; WAL is archived by
    # the postgres service itself), ClickHouse and the files bucket, a
    # monthly restore drill, /metrics (internal/backup, docs/backup.md).
    # In dev the backups land in the same MinIO, bucket flox-backups; in
    # production BACKUP_S3_* points off-site. `make backup-now`,
    # `make backup-drill`, `make backup-list`.
    build:
      context: ../apps
      dockerfile: cmd/backup/Dockerfile
      target: backup
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      BACKUP_DATABASE_URL: postgres://flox:flox@postgres:5432/flox?sslmode=disable
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: flox
      CLICKHOUSE_USER: flox
      BACKUP_S3_ENDPOINT: http://minio:9000
      BACKUP_S3_REGION: us-east-1
      BACKUP_S3_BUCKET: flox-backups
      BACKUP_S3_ACCESS_KEY_ID: flox-minio-admin
      BACKUP_S3_SECRET_ACCESS_KEY: flox-minio-secret
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: flox
      S3_ACCESS_KEY_ID: flox-minio-admin
      S3_SECRET_ACCESS_KEY: flox-minio-secret
      BACKUP_AT: "03:00"
      BACKUP_DRILL_DAY: "1"
    volumes:
      # The live data directory, read-only: WAL-G reads it for the base
      # backup. Same path as in the postgres container.
      - postgres_data:/var/lib/postgresql/data:ro
      - backup_drill:/var/lib/flox-drill
    ports:
      - "8083:8083"

  prometheus:
    # §53/Phase 29. Scrapes api/tracker/worker by their compose service
    # name (see prometheus.yml) now that all three run as containers on
    # this same network — no host networking needed.
    image: prom/prometheus:v3.1.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # §61/Phase 33: alerting rules (infra/alerts.yml) — prometheus.yml's
      # `rule_files: [alerts.yml]` is resolved relative to
      # /etc/prometheus/ inside the container, so this needs its own
      # mount alongside prometheus.yml itself.
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

# Pinned subnet: docker's auto-pick landed on 192.168.0.0/20, which shadows
# common home/office LANs (192.168.0.0/24) and breaks host -> container traffic.
networks:
  default:
    ipam:
      config:
        - subnet: 10.99.0.0/24

volumes:
  postgres_data:
  clickhouse_data:
  redis_data:
  nats_data:
  minio_data:
  prometheus_data:
  backup_drill:
  api_go_mod_cache:
  api_go_build_cache:
  tracker_go_mod_cache:
  tracker_go_build_cache:
  worker_go_mod_cache:
  worker_go_build_cache:
  web_node_modules:
  web_next_cache:
