# Prometheus alerting rules (§61, Phase 33). Every threshold ties
# directly to a number this project already committed to elsewhere —
# CLAUDE.md non-negotiable #9's tracking latency budget, §45's zero-loss
# guarantee — rather than an invented one, and every metric name here is
# one of the nine docs/observability.md (§53, Phase 29) already wired up
# and verified against real traffic; this phase adds no new metrics, only
# rules over the existing ones.
#
# Loaded by infra/prometheus.yml (dev) via `rule_files:`, and by any
# production Prometheus the same way — see docs/deployment.md's
# monitoring section. Validate with `promtool check rules infra/alerts.yml`
# after editing.
#
# No Alertmanager service ships anywhere in this repo (docker-compose.dev/
# test.yml included): routing an alert to Slack/email/PagerDuty needs a
# real receiver and credential this project has never had a use for
# outside this file, and standing up an Alertmanager with no real
# receiver behind it would be exactly the "fake API that looks real"
# CLAUDE.md forbids. These rules ARE real and Prometheus evaluates them
# regardless (visible under its own Alerts tab) — wiring a receiver is a
# real deployment's job. See docs/deployment.md for a documented (not
# run) Alertmanager config example.
groups:
  - name: flox.tracking
    rules:
      - alert: TrackingLatencyBudgetExceeded
        # CLAUDE.md non-negotiable #9: "tracking p50 < 20ms / p95 < 50ms
        # (excl. third-party latency)". 0.05 here is a literal bucket
        # boundary in apps/internal/metrics.hotPathBuckets, chosen
        # specifically to match this budget — see that file's own comment.
        expr: histogram_quantile(0.95, sum(rate(flox_tracking_latency_seconds_bucket[5m])) by (le)) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "apps/tracker p95 redirect latency exceeds the 50ms budget"
          description: "p95 tracking latency has been above 50ms for 5m — CLAUDE.md non-negotiable #9's hot-path budget is broken. Check for a slow routingstore query, ClickHouse/Postgres contention, or a co-located CPU-bound process."

      - alert: TrackerServingStaleRouting
        # internal/routingcache keeps serving the last known routing while
        # Postgres fails — clicks still work, but edits made meanwhile are
        # not applied and campaigns not yet cached return 502.
        expr: sum(rate(flox_routing_cache_requests_total{result=~"refresh_error|stale_on_error|error"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "apps/tracker is serving cached routing because Postgres reads fail"
          description: "Routing cache refreshes/loads have been failing for 5m. Clicks for already-cached campaigns are served from memory; uncached ones fail. Check Postgres reachability from apps/tracker."

      - alert: TrackingServiceDown
        expr: up{job="flox-tracker"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "apps/tracker is down"
          description: "Prometheus has not scraped a healthy apps/tracker instance for 1m — every tracking link is failing to redirect."

      - alert: TrackerClicksOverIPLimit
        # Audit REL-2: a click over TRACKER_IP_CLICK_LIMIT is sent to the
        # campaign's fallback and recorded nowhere (audit SEC-4). A few
        # are a flood being turned away; a large share is real visitors
        # lost — usually a proxy or CDN in front with TRUSTED_PROXIES
        # unset (see UntrustedProxyInFront), or a carrier NAT.
        expr: sum(rate(flox_tracking_requests_total{outcome="rate_limited"}[10m])) / sum(rate(flox_tracking_requests_total[10m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Over 5% of clicks are turned away by the per-IP limit"
          description: "For 10m more than 5% of tracking requests were over TRACKER_IP_CLICK_LIMIT and went to the campaign fallback unrecorded. The campaign page shows how many per campaign. Check TRUSTED_PROXIES, then whether one source floods the tracker."

      - alert: UntrustedProxyInFront
        # Audit REL-2: most requests carry X-Forwarded-For from a peer
        # outside TRUSTED_PROXIES — the tracker sits behind a proxy or CDN
        # it does not trust, so every visitor gets the proxy's address and
        # they all share one per-IP click limit.
        expr: sum(rate(flox_untrusted_forwarded_requests_total{job="flox-tracker"}[15m])) / sum(rate(flox_tracking_requests_total[15m])) > 0.5
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "apps/tracker ignores X-Forwarded-For from its own proxy"
          description: "For 15m most tracker requests had X-Forwarded-For from a peer outside TRUSTED_PROXIES. Visitors' IPs collapse onto the proxy's: the per-IP click limit turns real traffic away and geo/unique clicks are wrong. Set TRUSTED_PROXIES to the proxy's or CDN's address ranges (docs/environment.md)."

  - name: flox.events
    rules:
      - alert: EventLossDetected
        # §43/CLAUDE.md's event model has no tolerance for silent loss —
        # these two counters (docs/observability.md's "Why event_loss is
        # two counters, not one") are each genuine, permanent loss by
        # construction: a full in-memory buffer, or events refused for
        # good by event_queue / still failing when shutdown's retry budget
        # ran out (a failed write is otherwise retried — see below).
        expr: rate(flox_events_buffer_dropped_total[5m]) > 0 or rate(flox_events_queue_write_failed_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "apps/tracker is losing click/conversion events"
          description: "flox_events_buffer_dropped_total or flox_events_queue_write_failed_total is increasing — real, permanent event loss (CLAUDE.md's tracked-events invariant), not a retryable condition. Check apps/tracker's own logs and Postgres health immediately."

      - alert: EventWritesRetrying
        # A failed write into Postgres event_queue is retried with backoff
        # (internal/eventbuf); nothing is lost while new events fit in the
        # 10k buffer. Sustained retries mean the buffer is filling and
        # EventLossDetected is next.
        expr: rate(flox_events_queue_write_retries_total[5m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "apps/tracker cannot write events to Postgres"
          description: "flox_events_queue_write_retries_total has been increasing for 2m — apps/tracker keeps retrying event writes into event_queue. Events wait in its in-memory buffer; once it fills they are dropped (EventLossDetected). Check Postgres reachability from the tracker."

      - alert: EventLossWindowGrowing
        # What a crash of apps/tracker would lose (audit REL-1): events
        # only in memory, the oldest waiting this long. Normally under the
        # 250 ms flush interval; 30 s means the sink has been stuck that
        # long and a tracker restart now loses every click since.
        expr: max(flox_events_buffer_oldest_seconds) > 30
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "apps/tracker holds unwritten events in memory"
          description: "A tracker has held events for over 30s without writing them (flox_events_buffer_oldest_seconds; flox_events_buffer_pending of them). They are lost if it crashes or is killed now — fix the event sink (Postgres event_queue / NATS) before restarting trackers."

      - alert: QueueBatchesDeadLettered
        # pgqueue.Fail: ClickHouse rejected a batch 5 times. The rows are
        # kept in Postgres (status 'dead') but are missing from reports
        # until an operator fixes the cause and puts them back
        # (docs/analytics-pipeline.md, "Backoff and dead-letter").
        expr: increase(flox_queue_dead_lettered_total[15m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "ClickHouse keeps rejecting event batches; they were dead-lettered"
          description: "flox_queue_dead_lettered_total increased — events are parked in Postgres (status = 'dead', see last_error) and missing from analytics. Fix the cause, then requeue them as documented."

      - alert: EventQueueBacklogGrowing
        # Phase 31's own load test never saw this gauge exceed a handful
        # of rows even at 6,000 req/s sustained (docs/performance.md) — a
        # sustained five-figure backlog means apps/worker's flush loop
        # (batch 500/idle 2s) has fallen behind real traffic or ClickHouse
        # is unreachable, not routine jitter.
        expr: flox_event_queue_depth > 10000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Postgres event_queue backlog is growing"
          description: "flox_event_queue_depth has been above 10,000 for 10m — apps/worker's flush loop is falling behind. Events are not yet lost (still durable in Postgres) but analytics/attribution are increasingly stale until this drains."

      - alert: EventStreamFallingBackToPostgres
        # internal/eventstream: NATS refused the tracker's events (down,
        # stream missing or full) and they went to Postgres event_queue
        # instead. Nothing is lost, but Postgres carries the click load again
        # — the ceiling the stream exists to remove (docs/event-stream.md).
        expr: rate(flox_eventstream_fallback_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "apps/tracker is writing events to Postgres because NATS refuses them"
          description: "flox_eventstream_fallback_total has been increasing for 5m. Check NATS health, the FLOX_EVENTS stream (nats stream info FLOX_EVENTS) and whether it is full (max bytes)."

      - alert: EventStreamPublishUnanswered
        # A publish without an answer is retried on NATS only, so a maybe-
        # stored message is not also written to Postgres; events wait in
        # the tracker's buffer meanwhile (30s grace, then Postgres).
        expr: rate(flox_eventstream_publish_errors_total{kind="unknown"}[5m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "NATS is not answering the tracker's publishes"
          description: "flox_eventstream_publish_errors_total{kind=\"unknown\"} has been increasing for 2m — publishes time out. Events wait in apps/tracker's buffer; once it fills they are dropped (EventLossDetected)."

      - alert: EventStreamBacklogGrowing
        # One message is one tracker batch (up to 500 events): a thousand
        # pending messages is up to half a million events not yet in
        # ClickHouse. The 2026-10-10 load test never saw more than 11.
        expr: flox_eventstream_pending_messages > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "NATS event stream backlog is growing"
          description: "flox_eventstream_pending_messages has been above 1,000 for 10m — apps/worker is not keeping up or ClickHouse is failing. Events are durable in JetStream (until the stream's max age, 7 days) but analytics are stale."

      - alert: EventStreamHandedOffToPostgres
        # ClickHouse rejected a message 10 deliveries in a row; the worker
        # moved its events to event_queue, whose flusher splits the batch
        # and dead-letters the bad event (QueueBatchesDeadLettered).
        expr: increase(flox_eventstream_handed_off_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "ClickHouse keeps rejecting a NATS event batch"
          description: "flox_eventstream_handed_off_total increased — a batch failed 10 times and moved to Postgres event_queue. Check apps/worker logs for the ClickHouse error."

      - alert: EventStreamUndecodableMessages
        # Not an event batch at all: terminated, its events (if any) lost.
        expr: increase(flox_eventstream_undecodable_total[15m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "The NATS event stream carried messages that are not event batches"
          description: "flox_eventstream_undecodable_total increased — something other than apps/tracker publishes to flox.events, or a tracker and worker version disagree on the format. Those messages were dropped."

  - name: flox.infra
    rules:
      - alert: ConversionsDiverge
        # internal/reconcile: Postgres postbacks (truth) vs ClickHouse
        # conversion_events, hourly over 3 days, leaving out the newest 30
        # minutes. Two runs in a row rule out an in-flight batch.
        expr: max(flox_reconciliation_mismatched_buckets) > 0
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "Reports disagree with the recorded conversions"
          description: "flox_reconciliation_mismatched_buckets has been above 0 for 2h: some (organization, day, status) has a different count or USD sum in ClickHouse than in Postgres postbacks. The worker log lists each bucket (\"conversions differ between postgres and clickhouse\"). Look for dead-lettered batches first (flox_queue_rows{status=\"dead\"})."

      - alert: ReconciliationNotRunning
        expr: time() - flox_reconciliation_last_success_timestamp_seconds > 3 * 3600
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "The Postgres/ClickHouse reconciliation has not succeeded for 3h"
          description: "No successful reconciliation run in 3h (flox_reconciliation_runs_total{outcome=\"error\"}); divergence between the stores would go unnoticed."

      - alert: QueueStalled
        # flox_queue_oldest_due_age_seconds catches a small queue that stopped
        # draining, which a depth threshold would not.
        expr: max by (queue) (flox_queue_oldest_due_age_seconds) > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "A worker queue has a row waiting over 5 minutes past due"
          description: "{{ $labels.queue }}: the oldest due row has waited over 5 minutes. apps/worker is down, stuck, or its target (ClickHouse, a partner endpoint) keeps failing."

      - alert: PostgresPoolSaturated
        expr: |
          sum by (service) (rate(flox_pg_pool_acquires_total{kind="empty"}[5m]))
            / sum by (service) (rate(flox_pg_pool_acquires_total{kind="all"}[5m])) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Most Postgres acquires wait for a free connection"
          description: "{{ $labels.service }}: over half of pool acquires found no idle connection for 10m. Raise pool_max_conns in DATABASE_URL (docs/deployment.md) or find the slow queries holding connections."

      - alert: RedisFailing
        expr: sum by (op) (rate(flox_redis_errors_total[5m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Redis calls are failing; falling back"
          description: "{{ $labels.op }}: Redis errors for 10m. Conversions read Postgres directly (slower), and rate limits fail open — /auth brute-force protection is off until Redis is back."

  - name: flox.fx
    rules:
      - alert: FXRatesStale
        # Reference rates skip weekends and holidays, so 2-3 days is normal.
        # Past fx.MaxStaleDays (7) new non-USD payouts and spend stop getting
        # a USD value and drop out of Revenue/Cost/ROI; alert well before.
        expr: flox_fx_latest_rate_age_seconds > 4 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "FX reference rates are going stale"
          description: "The newest FX rate is over 4 days old — apps/worker's rate sync is failing (see flox_fx_sync_total{outcome=\"error\"}). After 7 days non-USD amounts are stored without a USD value until rates return; the next successful sync repairs them."

      - alert: FXSyncFailing
        expr: increase(flox_fx_sync_total{outcome="error"}[1d]) >= 3 and increase(flox_fx_sync_total{outcome="ok"}[1d]) == 0
        labels:
          severity: warning
        annotations:
          summary: "FX rate sync has not succeeded for a day"
          description: "Every apps/worker FX sync in the last 24h failed. Rates already on file keep working for up to 7 days."

  - name: flox.postbacks
    rules:
      - alert: PostbackIngestFailing
        # 500s tell the network to retry, so nothing is lost yet — but a
        # sustained rate means conversions are piling up at the networks.
        expr: sum(rate(flox_postback_incoming_total{result="internal_error"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Incoming postbacks are failing with internal errors"
          description: "apps/tracker has answered incoming postbacks with 500 for 5m (Postgres or ClickHouse trouble on the record path). Networks retry, but conversions are delayed until it clears."

      - alert: AttributionUnknownClickHigh
        # Some unknown clicks are normal (bad ids, stale tests). A large
        # share means clicks are not reaching click_lookup in time or a
        # network echoes the wrong parameter.
        expr: |
          sum(rate(flox_attribution_outcomes_total{outcome="unknown_click"}[30m]))
            / sum(rate(flox_attribution_outcomes_total[30m])) > 0.2
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Over 20% of conversions match no click"
          description: "flox_attribution_outcomes_total{outcome=unknown_click} is above 20% of all conversions for 30m. Check the worker's event flush lag (flox_queue_oldest_due_age_seconds) and the networks' postback URL templates."

      - alert: PostbackDeliveryDeadLetterRateHigh
        # "dead" = apps/internal/postback exhausted MaxAttempts —
        # genuinely, permanently lost per docs/observability.md's own
        # definition, distinct from "retrying" (still in flight).
        expr: |
          sum(rate(flox_postback_deliveries_total{outcome="dead"}[15m]))
            /
          sum(rate(flox_postback_deliveries_total[15m]))
          > 0.05
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "More than 5% of outgoing postback deliveries are dead-lettering"
          description: "A network operator's postback_url is likely unreachable, rejecting FLOX's requests, or urlsafety is blocking it (§54 SSRF guard) — check apps/worker's Deliverer logs and the affected network's configured postback_url."

  - name: flox.analytics
    rules:
      - alert: AnalyticsQueryLatencyHigh
        expr: histogram_quantile(0.95, sum(rate(flox_analytics_query_latency_seconds_bucket[15m])) by (le, endpoint)) > 2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "ClickHouse analytics queries are slow (p95 > 2s)"
          description: "{{ $labels.endpoint }} p95 latency has been above 2s for 15m — check ClickHouse load/disk, or whether data volume has outgrown docs/performance.md's ~6k-row benchmark baseline."

  - name: flox.services
    rules:
      - alert: APIServiceDown
        expr: up{job="flox-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "apps/api is down"
          description: "Prometheus has not scraped a healthy apps/api instance for 1m — the entire control-plane API (campaigns, auth, analytics, everything apps/web depends on) is unreachable."

      - alert: WorkerServiceDown
        expr: up{job="flox-worker"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "apps/worker is down"
          description: "Prometheus has not scraped a healthy apps/worker instance for 1m — event flushing, outgoing postback delivery, and ad-spend sync have all stopped. Events remain durable in Postgres (see EventQueueBacklogGrowing) but nothing is draining them."

  - name: flox.backup
    # Tech audit 2026-10-06, DO2 (internal/backup, docs/backup.md). Every
    # metric is read back from the backup bucket by the sidecar, so these
    # hold across its restarts.
    rules:
      - alert: BackupSidecarDown
        expr: up{job="flox-backup"} == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "backup sidecar is down"
          description: "No nightly backups or drills run while it is down. WAL archiving does not depend on it and goes on."

      - alert: BackupMissing
        # Daily at BACKUP_AT; 26h allows one slow run before firing.
        expr: time() - flox_backup_last_success_timestamp_seconds > 26 * 3600
        labels:
          severity: critical
        annotations:
          summary: "no {{ $labels.store }} backup for over 26h"
          description: "The newest {{ $labels.store }} backup in the bucket is older than a day. Check the backup sidecar's log (`make backup-list`, flox_backup_failures_total)."

      - alert: BackupNeverTaken
        # Per store the sidecar covers (flox_backup_store_enabled): Postgres
        # is 0 with BACKUP_POSTGRES=off, a managed Postgres's own PITR.
        expr: flox_backup_store_enabled == 1 unless on(store) flox_backup_last_success_timestamp_seconds
        for: 26h
        labels:
          severity: critical
        annotations:
          summary: "the backup bucket has no {{ $labels.store }} backup"
          description: "The sidecar has run for a day without a single {{ $labels.store }} backup in the bucket."

      - alert: WALArchivingFailing
        # Every WAL segment that fails to archive is lost from PITR, and
        # piles up in pg_wal until the disk fills.
        expr: flox_backup_wal_archive_failing == 1
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Postgres cannot archive WAL"
          description: "pg_stat_archiver's last attempt failed and none has succeeded since, for 10m. Point-in-time recovery stops at the last archived segment and pg_wal grows. Check the postgres container's log for wal-g wal-push errors (bucket credentials, reachability)."

      - alert: RestoreDrillFailed
        expr: flox_backup_drill_last_timestamp_seconds{result="failure"} > on() group_left() (flox_backup_drill_last_timestamp_seconds{result="success"} or on() vector(0))
        labels:
          severity: critical
        annotations:
          summary: "the last restore drill failed"
          description: "A backup that does not restore is not a backup. See the drill report (`make backup-list` names it) for the failed checks."

      - alert: RestoreDrillOverdue
        # Monthly on BACKUP_DRILL_DAY; 35 days allows a missed day.
        expr: time() - flox_backup_drill_last_timestamp_seconds{result="success"} > 35 * 86400
        labels:
          severity: warning
        annotations:
          summary: "no passed restore drill for over 35 days"
          description: "Run `make backup-drill` (or `flox-backup drill` in the sidecar) and check BACKUP_DRILL_DAY."
