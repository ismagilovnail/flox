# Hot-reload config for the api Dockerfile's `dev` stage (infra/docker-
# compose.dev.yml). Only used inside that container — irrelevant to a
# host `go run`/`make api-build` workflow.
root = "."
tmp_dir = "tmp/api"

[build]
cmd = "go build -o ./tmp/api/bin ./api"
bin = "tmp/api/bin"
include_ext = ["go"]
exclude_dir = ["tmp", "bin", "web", "e2e"]
delay = 200
stop_on_error = true

[log]
time = false

[misc]
clean_on_exit = false
