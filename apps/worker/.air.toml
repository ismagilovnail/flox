# Hot-reload config for the worker Dockerfile's `dev` stage (infra/
# docker-compose.dev.yml). Only used inside that container — irrelevant to
# a host `go run`/`make worker-build` workflow.
root = "."
tmp_dir = "tmp/worker"

[build]
cmd = "go build -o ./tmp/worker/bin ./worker"
bin = "tmp/worker/bin"
include_ext = ["go"]
exclude_dir = ["tmp", "bin", "web", "e2e"]
delay = 200
stop_on_error = true

[log]
time = false

[misc]
clean_on_exit = false
